name = "travel-tracker-auth"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
# Must match DRIVE_CLIENT_ID in index.html.
GOOGLE_CLIENT_ID = "199114602407-31geakspltrct7pu85vm9kofu3c9rfaq.apps.googleusercontent.com"
# Only this origin may call the Worker. A device_id is a session credential, so
# it must not be usable from any other page.
ALLOWED_ORIGIN = "https://jskagan.github.io"

# GOOGLE_CLIENT_SECRET is NOT here on purpose -- set it with:
#   wrangler secret put GOOGLE_CLIENT_SECRET

# Create with: wrangler kv namespace create AUTH_KV
# then paste the printed id below.
[[kv_namespaces]]
binding = "AUTH_KV"
id = "2012edf05afd41339a4e8c74efbe51d2"
