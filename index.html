// Report is fully recomputed from all saved invoices every time --
// simpler and safer than trying to incrementally patch it, and cheap
// at the data volumes a fractional-invoice log actually has.
let cachedReport = null;

// Month is derived from the invoice's billing period (period_start),
// not the leg date -- leg dates on this template are "MM/DD" with no
// year, so the invoice period is the only reliable source of year+month.
function monthKeyFromPeriodStart(periodStart) {
  if (!periodStart) return '0000-00';
  const parts = periodStart.split('/'); // MM/DD/YYYY
  if (parts.length !== 3) return '0000-00';
  const [mm, , yyyy] = parts;
  return `${yyyy}-${mm.padStart(2, '0')}`;
}
function monthLabelFromKey(key) {
  const [yyyy, mm] = key.split('-');
  if (yyyy === '0000') return 'Unknown month';
  const d = new Date(Number(yyyy), Number(mm) - 1, 1);
  return d.toLocaleString('en-US', { month: 'long', year: 'numeric' });
}
function round2(n) { return Math.round(n * 100) / 100; }

async function recomputeReport() {
  const invoices = await getInvoicesCached(true);
  const byPassenger = {};

  for (const inv of invoices) {
    const invoiceNo = inv.invoice.invoice_id;
    const periodStart = inv.invoice.period_start;
    const monthKey = monthKeyFromPeriodStart(periodStart);
    const legs = inv.flight_legs || [];
    const subtotals = inv.reservation_subtotals || [];

    legs.forEach((leg, legIndex) => {
      // reservation_subtotals aligns with flight_legs by POSITION, not by
      // reservation_no -- a single reservation can have multiple legs,
      // each with its own per-leg "Hourly Total / Fuel / Total Charges"
      // line in the source PDF, so matching by reservation_no alone would
      // be ambiguous whenever legs share one (as they commonly do).
      const subtotal = subtotals[legIndex] || {};

      const name = (leg.lead_passenger || '').trim() || 'Unassigned';
      if (!byPassenger[name]) {
        byPassenger[name] = { name, totalHours: 0, totalBilledHours: 0, totalHourlyTotal: 0, totalFuelTotal: 0, totalTotalCharges: 0, tripCount: 0, monthsByKey: {} };
      }
      const p = byPassenger[name];
      if (!p.monthsByKey[monthKey]) {
        p.monthsByKey[monthKey] = {
          monthKey, monthLabel: monthLabelFromKey(monthKey),
          subtotalHours: 0, subtotalBilledHours: 0, subtotalHourlyTotal: 0, subtotalFuelTotal: 0, subtotalTotalCharges: 0,
          trips: [],
        };
      }
      const hoursVal = leg.hours != null ? leg.hours : 0;
      const billed = leg.billed_hours != null ? leg.billed_hours : 0;
      const hourlyTotal = subtotal.hourly_total != null ? subtotal.hourly_total : 0;
      const fuelTotal = subtotal.fuel_total != null ? subtotal.fuel_total : 0;
      const totalCharges = subtotal.total_charges != null ? subtotal.total_charges : 0;

      p.monthsByKey[monthKey].subtotalHours += hoursVal;
      p.monthsByKey[monthKey].subtotalBilledHours += billed;
      p.monthsByKey[monthKey].subtotalHourlyTotal += hourlyTotal;
      p.monthsByKey[monthKey].subtotalFuelTotal += fuelTotal;
      p.monthsByKey[monthKey].subtotalTotalCharges += totalCharges;
      p.monthsByKey[monthKey].trips.push({
        invoiceNo, periodStart, date: leg.leg_date,
        legId: leg.id,
        from: leg.origin, to: leg.destination,
        fromCode: leg.origin_code, toCode: leg.destination_code,
        billedHours: leg.billed_hours, hours: leg.hours,
        hourlyTotal: subtotal.hourly_total, fuelTotal: subtotal.fuel_total, totalCharges: subtotal.total_charges,
        flightType: leg.flight_type || "", notes: leg.notes || "",
      });
      p.totalHours += hoursVal;
      p.totalBilledHours += billed;
      p.totalHourlyTotal += hourlyTotal;
      p.totalFuelTotal += fuelTotal;
      p.totalTotalCharges += totalCharges;
      p.tripCount += 1;
    });
  }

  const passengers = Object.values(byPassenger).sort((a, b) => a.name.localeCompare(b.name));
  for (const p of passengers) {
    const months = Object.values(p.monthsByKey).sort((a, b) => a.monthKey.localeCompare(b.monthKey));
    for (const m of months) {
      m.trips.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      m.subtotalHours = round2(m.subtotalHours);
      m.subtotalBilledHours = round2(m.subtotalBilledHours);
      m.subtotalHourlyTotal = round2(m.subtotalHourlyTotal);
      m.subtotalFuelTotal = round2(m.subtotalFuelTotal);
      m.subtotalTotalCharges = round2(m.subtotalTotalCharges);
    }
    delete p.monthsByKey;
    p.months = months;
    p.totalHours = round2(p.totalHours);
    p.totalBilledHours = round2(p.totalBilledHours);
    p.totalHourlyTotal = round2(p.totalHourlyTotal);
    p.totalFuelTotal = round2(p.totalFuelTotal);
    p.totalTotalCharges = round2(p.totalTotalCharges);
  }

  const report = { generated_at: new Date().toISOString(), passengers };
  const persisted = await Store.saveReport(report);
  if (!persisted) console.error('recomputeReport: failed to persist report (display is still correct -- this only affects offline/next-session caching)');
  cachedReport = report;
  return report;
}

async function getReportCached(force = false) {
  if (cachedReport && !force) return cachedReport;
  cachedReport = await Store.getReport();
  return cachedReport;
}

// ---- Review resolution ----
// Applies a person's chosen corrections to one flagged leg: updates the
// stored invoice, clears that leg's warnings (removing it from the
// Review Queue), and recomputes the Passenger Report since edited
// fields (billed hours, names) can change totals.
async function resolveLeg(invoiceNo, legId, edits) {
  const inv = await Store.getInvoice(invoiceNo);
  if (!inv) return { ok: false, error: `Invoice ${invoiceNo} not found` };
  const leg = (inv.flight_legs || []).find(l => l.id === legId);
  if (!leg) return { ok: false, error: `Leg ${legId} not found on invoice ${invoiceNo}` };

  Object.assign(leg, edits);
  leg._warnings = null;
  leg._resolvedAt = new Date().toISOString();

  const saveResult = await Store.saveInvoice(invoiceNo, inv);
  if (!saveResult.ok) return { ok: false, error: saveResult.error || 'storage write failed' };

  cachedInvoices = null;
  await recomputeReport();
  return { ok: true };
}

// Deletes known/likely storage keys directly, WITHOUT relying on
// window.storage.list() -- used as a recovery path specifically for
// when list() itself is the thing failing (so we can't enumerate real
// keys to delete). Only removes keys used during this app's own testing;
// if other invoice numbers were saved beyond what's listed here, they'd
// need to be identified and cleared separately.
async function emergencyResetStorage() {
  const candidateKeys = [
    'report:passenger_hours',
    'invoice:123456789',
  ];
  for (const key of candidateKeys) {
    try { await window.storage.delete(key, false); } catch (e) { /* best-effort */ }
  }
}

function setActiveNav(view, param) {
  document.querySelectorAll(".rail-item[data-view]").forEach(el => {
    el.classList.toggle("active", el.dataset.view === view && (el.dataset.param || undefined) === param);
  });

  if (isAmbiguitiesView) {

  if (isPassengersView) {
    document.getElementById("passengers-submenu").classList.remove("collapsed");
    document.getElementById("passengers-caret").textContent = "▾";
  }
  const isPsReservationsView = view === "reservations" || view === "psbalance" || view === "psinvoices" || view === "psinvoicedetail";
  document.getElementById("psreservations-toggle").classList.toggle("active", isPsReservationsView);
  if (isPsReservationsView) {

async function navigate(view, param) {
  const previousView = currentView;
  currentView = view;
  setActiveNav(view, param);
  // Entering Reports from somewhere else (not just switching between its
  // own Totals/Kagan/Lopata or Hours/Legs/Flight Log sub-views) forces a
  // fresh recompute -- important now that data is shared across multiple
  // signed-in users/sessions, so changes someone else made elsewhere
  // aren't missed by an overly long-lived cache.
  if (view === "passengers" && previousView !== "passengers") {
    cachedReport = null;
  }
  try {
    if (view === "upload") await renderUpload();
    else if (view === "home") await renderHome();
    else if (view === "invoices") await renderInvoiceList();
    else if (view === "detail") await renderInvoiceDetail(param);
    else if (view === "review") await renderReviewQueue();
    else if (view === "resolved") await renderResolvedIssues();
    else if (view === "trends") await renderTrends();
    else if (view === "reservations") await renderReservations();
    else if (view === "psbalance") await renderPsBalance();
    else if (view === "psinvoices") await renderPsInvoices();
    else if (view === "psinvoicedetail") await renderPsInvoiceDetail(param);
    else if (view === "utilitiesusers") await renderUtilitiesUsers();
    else if (view === "utilitiesdeletepsreservations") await renderUtilitiesDeletePsReservations();
    else if (view === "utilitiesreparsepsreservations") await renderUtilitiesReparsePsReservations();
    else if (view === "utilitiesreparsepsinvoices") await renderUtilitiesReparsePsInvoices();
    else if (view === "passengers") await renderPassengerReport(param || "totals");
  } catch (e) {
    // Catch-all so a bug in one view shows a visible error instead of an
    // infinite "Loading…" -- individual views may also handle their own
    // errors more specifically (see renderPassengerReport).
    console.error(`navigate(${view}) failed:`, e);
    const isStorageError = /storage|list failed|invalid response/i.test(e.message || "");
    main.innerHTML = `
      <div class="card">
        <span style="color:var(--red)">Something went wrong loading this page: ${esc(e.message)}</span>
        <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn" id="nav-retry">Retry</button>
          ${isStorageError ? '<button class="btn danger" id="nav-reset">Reset stored data &amp; retry</button>' : ''}
        </div>
        ${isStorageError ? `<div style="margin-top:10px; font-size:12px; color:var(--muted);">
          This clears locally saved invoices/reports (best-effort, targets known test data from
          this session) in case accumulated data is what's breaking storage reads -- it won't help
          if this is a platform-side issue instead.
        </div>` : ''}
      </div>`;
    document.getElementById("nav-retry").addEventListener("click", () => navigate(view, param));
    const resetBtn = document.getElementById("nav-reset");
    if (resetBtn) {
      resetBtn.addEventListener("click", async () => {
        resetBtn.disabled = true;
        resetBtn.textContent = "Resetting…";
        await emergencyResetStorage();
        cachedInvoices = null;
        cachedReport = null;
        toast("Attempted storage reset. Retrying…", "success");
        navigate(view, param);
      });
    }
  }
  try {
    await refreshNavCounts();
  } catch (e) {
    console.error('refreshNavCounts failed:', e);
    showStorageHealthBanner(e.message || String(e));
  }
}

function renderUpload() {
  if (!isOwner) {
    main.innerHTML = `
      <div class="page-title">Upload invoice</div>
      <div class="page-sub">View-only access.</div>
      <div class="card"><div class="empty-state">Only the data owner can upload invoices. You have read-only access to the shared flight log.</div></div>
    `;
    return;
  }
  main.innerHTML = `
    <div class="page-title">Upload invoice</div>
    <div class="page-sub">Drop a flight activity invoice PDF to parse it into your flight log.</div>
    <div class="card">
      <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">✈️</div>
        <div class="dropzone-title">Drop PDF here, or click to choose a file</div>
        <div class="dropzone-sub">Parsed entirely in your browser — nothing is uploaded anywhere.</div>
        <input type="file" id="file-input" accept="application/pdf">
      </div>
    </div>
    <div id="upload-result"></div>
  `;
  const dz = document.getElementById("dropzone");
  const input = document.getElementById("file-input");
  dz.addEventListener("click", () => input.click());
  dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("drag"); });
  dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
  dz.addEventListener("drop", e => {
    e.preventDefault(); dz.classList.remove("drag");
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  input.addEventListener("change", () => { if (input.files.length) handleFile(input.files[0]); });
}

// Reverts one auto-applied change on an in-memory (not-yet-saved) parse
// result, and re-flags that leg for manual review by regenerating its
// warnings from current field values.
function undoAutoResolveChange(result, change) {
  const leg = (result.flight_legs || []).find(l => l.id === change.legId);
  if (!leg) return;
  leg[change.field] = change.oldValue;
  leg._warnings = buildLegWarnings(leg);
  leg._autoResolved = false;
  delete leg._resolvedAt;
}

async function handleFile(file) {
  const resultEl = document.getElementById("upload-result");
  resultEl.innerHTML = `<div class="card"><span style="color:var(--muted)">Parsing ${esc(file.name)}…</span></div>`;
  try {
    const buf = await file.arrayBuffer();
    if (buf.byteLength !== file.size) {
      console.error(`File read size mismatch: file.size=${file.size} but arrayBuffer byteLength=${buf.byteLength}`);
    }
    const result = await parseInvoicePdf(buf, file.size);
    const invoiceNo = result.invoice.invoice_id;
    const existing = await Store.getInvoice(invoiceNo);

    function renderResultUI() {
      const reviewCount = legsNeedingReviewCount(result);
      const checksOk = result.invoice._check_charges_sum_ok !== false
        && result.invoice._check_reservations_sum_to_invoice_total !== false;

      resultEl.innerHTML = `
      <div class="card">
        <div class="card-title">Parse result</div>
        <div class="field-grid">
          <div class="field"><div class="k">Invoice No.</div><div class="v">${esc(invoiceNo)}</div></div>
          <div class="field"><div class="k">Period</div><div class="v">${esc(result.invoice.period_start)} – ${esc(result.invoice.period_end)}</div></div>
          <div class="field"><div class="k">Total</div><div class="v">${fmtMoney(result.invoice.total_invoice_amount)}</div></div>
        </div>
        <div class="parse-summary">
          <span class="badge ${checksOk ? 'ok' : 'warn'}"><span class="dot"></span>${checksOk ? 'Checksums OK' : 'Checksum mismatch'}</span>
          ${reviewCount ? `<span class="badge warn"><span class="dot"></span>${reviewCount} leg(s) need review</span>` : `<span class="badge ok"><span class="dot"></span>No leg warnings</span>`}
          ${existing ? `<span class="badge warn"><span class="dot"></span>Already imported — saving will overwrite</span>` : ''}
        </div>
        <button class="btn primary" id="save-btn">${existing ? 'Overwrite saved invoice' : 'Save to Log Book'}</button>
        ${result._diagnostics && result._diagnostics.page2LegRowsMatched === 0 ? `
          <div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--line);">
            <div style="color:var(--red); font-size:13px; margin-bottom:8px;">
              ⚠ Found ${result._diagnostics.numPages} page(s) but matched 0 flight legs on page 2.
              This usually means the column layout on this PDF doesn't match what the parser expects.
            </div>
            <details style="font-size:12px; color:var(--muted);">
              <summary style="cursor:pointer;">Show diagnostic detail</summary>
              <pre style="white-space:pre-wrap; font-family:var(--mono); font-size:11px; background:var(--panel-2); padding:10px; border-radius:6px; margin-top:8px;">${esc(JSON.stringify(result._diagnostics, null, 2))}</pre>
            </details>
          </div>
        ` : result._diagnostics && result._diagnostics.page2Error ? `
          <div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--line); color:var(--red); font-size:13px;">
            ⚠ Page 2 (flight legs) failed to parse: ${esc(result._diagnostics.page2Error)}
          </div>
        ` : ''}
      </div>
    `;
      document.getElementById("save-btn").addEventListener("click", async () => {
        const btn = document.getElementById("save-btn");
        btn.disabled = true;
        btn.textContent = "Saving…";
        const saveResult = await Store.saveInvoice(invoiceNo, result);
        if (!saveResult.ok) {
          btn.disabled = false;
          btn.textContent = existing ? "Overwrite saved invoice" : "Save to Log Book";
          toast(`Could not save invoice ${invoiceNo}: ${saveResult.error || 'unknown storage error'}`, "error");
          return;
        }
        cachedInvoices = null;
        // The save itself already succeeded at this point -- don't let a
        // failure in the (separate) report-refresh step make it look like
        // the whole upload failed. Report just won't be up to date until
        // storage.list() works again; the invoice itself is safely saved.
        let reportNote = "Passenger report updated.";
        try {
          await recomputeReport();
        } catch (e) {
          console.error("recomputeReport after save failed (invoice was still saved):", e);
          reportNote = "Passenger report could not be refreshed right now (storage issue) -- your invoice was still saved.";
        }
        toast(`Saved invoice ${invoiceNo} to your log book. ${reportNote}`, "success");
        navigate("detail", invoiceNo);
      });
    }

    renderResultUI();
  } catch (e) {
    resultEl.innerHTML = `
      <div class="card">
        <div style="color:var(--red); white-space:pre-wrap; word-break:break-word; font-size:13px;">Could not parse this PDF: ${esc(e.message)}</div>
        <details style="margin-top:10px; font-size:11px; color:var(--muted);">
          <summary style="cursor:pointer;">Show technical detail</summary>
          <pre style="white-space:pre-wrap; font-family:var(--mono); font-size:10px; background:var(--panel-2); padding:10px; border-radius:6px; margin-top:8px;">${esc(e.stack || "(no stack trace available)")}</pre>
        </details>
      </div>`;
  }
}

// Formats "MM/DD/YYYY" as "Month Day, Year" (e.g. "March 1, 2025").
function formatDateLong(mmddyyyy) {
  if (!mmddyyyy) return "";
  const parts = mmddyyyy.split("/");
  if (parts.length !== 3) return mmddyyyy;
  const [mm, dd, yyyy] = parts;
  const d = new Date(Number(yyyy), Number(mm) - 1, Number(dd));
  if (isNaN(d.getTime())) return mmddyyyy;
  return d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
}

              <td>${esc(leg.origin)}</td>
              <td>${esc(leg.destination)}</td>
              <td>${esc(leg.origin_code)} → ${esc(leg.destination_code)}</td>
              <td>${esc(leg.aircraft_actual_type)}</td>
              <td>${fmtNum(leg.hours)}</td>
              <td>${fmtNum(leg.billed_hours)}</td>
              <td>${leg.num_passengers ?? '—'}</td>
              <td>${esc(leg.lead_passenger)}</td>
            </tr>`).join("")}
        </tbody>
      </table>` : `<div class="empty-state">
          No leg-level detail on this invoice.
          ${inv._diagnostics ? `<details style="text-align:left; margin-top:10px; font-size:12px;">
            <summary style="cursor:pointer; color:var(--muted);">Why? (diagnostic detail)</summary>
            <pre style="white-space:pre-wrap; font-family:var(--mono); font-size:11px; background:var(--panel-2); padding:10px; border-radius:6px; margin-top:8px; text-align:left;">${esc(JSON.stringify(inv._diagnostics, null, 2))}</pre>
          </details>` : ''}
        </div>`}
    </div>

    ${isOwner ? `
      <div class="card" id="delete-card">
        <button class="btn danger" id="delete-btn">Delete this invoice</button>
      </div>
    ` : ''}
  `;
  document.getElementById("back").addEventListener("click", () => navigate("invoices"));

  function wireDeleteButton() {
    const deleteBtn = document.getElementById("delete-btn");
    if (!deleteBtn) return; // non-owner: delete-card wasn't rendered at all
    const deleteCard = document.getElementById("delete-card");
    deleteBtn.addEventListener("click", () => {
      // In-app confirmation instead of window.confirm(), which is
      // unreliable inside a sandboxed iframe (can silently no-op).
      deleteCard.innerHTML = `
        <div style="margin-bottom:10px; color: var(--red);">Delete invoice ${esc(i.invoice_id)}? This can't be undone.</div>
        <button class="btn danger" id="confirm-delete-btn">Yes, delete it</button>
        <button class="btn" id="cancel-delete-btn">Cancel</button>
      `;
      document.getElementById("cancel-delete-btn").addEventListener("click", () => {
        deleteCard.innerHTML = `<button class="btn danger" id="delete-btn">Delete this invoice</button>`;
        wireDeleteButton();
      });
      document.getElementById("confirm-delete-btn").addEventListener("click", async () => {
        const btn = document.getElementById("confirm-delete-btn");
        btn.disabled = true;
        btn.textContent = "Deleting…";
        const ok = await Store.deleteInvoice(i.invoice_id);
        if (!ok) {
          toast(`Could not delete invoice ${i.invoice_id} — storage delete failed. Please try again.`, "error");
          deleteCard.innerHTML = `<button class="btn danger" id="delete-btn">Delete this invoice</button>`;
          wireDeleteButton();
          return;
        }
        cachedInvoices = null;
        let reportNote = "Passenger report updated.";
        try {
          await recomputeReport();
        } catch (e) {
          console.error("recomputeReport after delete failed (invoice was still deleted):", e);
          reportNote = "Passenger report could not be refreshed right now (storage issue) -- your invoice was still deleted.";
        }
        toast(`Invoice deleted. ${reportNote}`, "success");
        navigate("invoices");
      });
    });
  }
  wireDeleteButton();
}

// ---- Review queue ----
function reviewInputStyle() {
  return "width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text); " +
         "padding:7px 9px; border-radius:6px; font-family:var(--mono); font-size:13px;";
}

function renderLegSummaryHTML(leg) {
  return `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;">
      <div>
        <div style="font-family:var(--mono); font-size:13px;">${esc(leg.leg_date)} · ${esc(leg.origin)} → ${esc(leg.destination)}</div>
        <div style="font-family:var(--sans); font-size:12px; color:var(--red); margin-top:6px;">${leg._warnings.map(esc).join("<br>")}</div>
      </div>
      ${isOwner ? '<button class="btn" data-resolve-btn>Resolve</button>' : ''}
    </div>`;
}

// Splits text into alternating word/whitespace tokens (so the original
// exact spacing can always be reconstructed), used to find and replace
// individual ambiguous words without disturbing the rest of the field.
function tokenizePreservingSpaces(text) {
  return (text || "").split(/(\s+)/);
}

// Words containing 'Y' are candidates for the known V->Y rendering issue.
// Returns each such word WITH its surrounding context (the full field
// text) so the picker can show "the word AND where it sits", not just
// the bare character.
// ---- Airport code lookup (for resolving V/Y and other code ambiguities) ----
// Fetched lazily (only once actually needed, not on every page load) from
// A LIVE, comprehensive fetch of the full airport database turned out
// not to be possible from inside this app: Claude's chat artifacts run
// under a strict CSP that blocks fetch() to arbitrary external domains
// (confirmed by testing -- it failed inside the real app even though an
// identical fetch worked fine in a normal unrestricted browser tab). The
// full public dataset is also too large (~78,000 airports) to embed
// directly without bloating this file substantially.
//
// So: this is a SMALL, curated, embedded list -- not comprehensive. It
// currently covers only the airports actually confirmed relevant to
// invoices seen so far. Add more {ident, municipality, region, name}
// entries here as new codes come up. For a full/unlimited lookup, use
// the standalone airport_lookup_test.html page instead, which runs
// outside Claude's CSP and can fetch the complete public database.
const EMBEDDED_AIRPORTS = [
  { ident: 'UNV', municipality: 'State College', region: 'PA', name: 'State College Regional Airport' },
  { ident: 'VES', municipality: 'Versailles', region: 'OH', name: 'Darke County Airport' },
];

const airportIndex = new Map();
for (const a of EMBEDDED_AIRPORTS) {
  airportIndex.set(a.ident.toUpperCase(), a);
}

function normalizeForMatch(s) {
  return (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

// Looks up a code in the small embedded list and checks whether its
// real-world city/state plausibly matches the city/state text already on
// the leg. Synchronous (no network involved) -- see notes above on why.
function verifyAirportCode(code, cityStateText) {
  if (!code) return { found: false, offlineList: true };
  const record = airportIndex.get(code.trim().toUpperCase());
  if (!record) return { found: false, offlineList: true };
  const normCityState = normalizeForMatch(cityStateText);
  const normMunicipality = normalizeForMatch(record.municipality);
  const cityMatch = !!(normCityState && normMunicipality &&
    (normCityState.includes(normMunicipality) || normMunicipality.includes(normCityState)));
  return { found: true, name: record.name, municipality: record.municipality, region: record.region, cityMatch };
}

function findAmbiguousWords(fieldName, text) {
  const tokens = tokenizePreservingSpaces(text);
  const found = [];
  tokens.forEach((tok, i) => {
    if (tok.trim() !== "" && /Y/.test(tok)) {
      found.push({ fieldName, tokenIndex: i, original: tok, corrected: tok.replace(/Y/g, "V") });
    }
  });
  return found;
}

// Rewrites a "City, State" string's city portion using an officially
// spelled municipality name, preserving whatever state/suffix already
// follows the last comma. Shared by the manual "Fix city spelling"
// button and the automatic resolver below, so both behave identically.
function applyCityFix(currentVal, officialMunicipality) {
  const lastComma = (currentVal || "").lastIndexOf(",");
  const statePart = lastComma !== -1 ? currentVal.slice(lastComma + 1).trim() : "";
  return statePart ? `${officialMunicipality}, ${statePart}` : officialMunicipality;
}

// Automatically resolves a leg's airport-code ambiguities WITHOUT asking
// the person first, but only when confidence is high: exactly one of the
// two candidate readings (original vs Y->V corrected) is both a real
// airport in the embedded database AND its city plausibly matches what's
// already on the leg. Every change made is recorded (with enough detail
// to undo it) rather than applied silently. If a leg has ambiguity that
// can't be confidently resolved this way, it's left alone for manual
// review exactly as before.
function attemptAutoResolveLeg(leg) {
  const changes = [];
  let anyRemainingAmbiguity = false;
  const codeCityPairs = [
    { codeField: "origin_code", cityField: "origin" },
    { codeField: "destination_code", cityField: "destination" },
  ];

  for (const { codeField, cityField } of codeCityPairs) {
    const ambiguous = findAmbiguousWords(codeField, leg[codeField] || "");
    if (!ambiguous.length) continue; // nothing ambiguous about this code -- leave it alone

    const { original, corrected } = ambiguous[0]; // a code field is always a single token
    const cityText = leg[cityField] || "";
    const resOriginal = verifyAirportCode(original, cityText);
    const resCorrected = verifyAirportCode(corrected, cityText);
    const originalMatches = resOriginal.found && resOriginal.cityMatch;
    const correctedMatches = resCorrected.found && resCorrected.cityMatch;

    let winner = null; // { value, res } for whichever reading is confirmed, if any
    if (correctedMatches && !originalMatches) winner = { value: corrected, res: resCorrected };
    else if (originalMatches && !correctedMatches) winner = { value: original, res: resOriginal };
    else { anyRemainingAmbiguity = true; continue; } // neither or both matched -- stay flagged

    if (leg[codeField] !== winner.value) {
      const oldCode = leg[codeField];
      leg[codeField] = winner.value;
      changes.push({
        legId: leg.id, field: codeField, oldValue: oldCode, newValue: winner.value,
        reason: `Matched "${winner.value}" in airport database (${winner.res.name}, ${winner.res.municipality}, ${winner.res.region})`,
      });
    }

    if (normalizeForMatch(cityText) !== normalizeForMatch(winner.res.municipality)) {
      const oldCity = leg[cityField];
      const newCity = applyCityFix(oldCity, winner.res.municipality);
      if (newCity !== oldCity) {
        leg[cityField] = newCity;
        changes.push({
          legId: leg.id, field: cityField, oldValue: oldCity, newValue: newCity,
          reason: `City spelling corrected using verified airport ${winner.value}`,
        });
      }
    }
  }

  if (changes.length) {
    // Persisted on the leg (not just returned) so a dedicated "Resolved
    // Issues" page can show this detail later, even in a fresh session
    // long after the transient parse-time/review-queue banners are gone.
    leg._autoResolveChangeLog = (leg._autoResolveChangeLog || []).concat(changes);
  }

  if (changes.length && !anyRemainingAmbiguity) {
    // Fully resolved with high confidence -- treat like a completed
    // manual review, same as clicking "Save changes & resolve" would.
    leg._warnings = null;
    leg._resolvedAt = new Date().toISOString();
    leg._autoResolved = true;
  } else if (changes.length) {
    // Partially resolved -- regenerate warnings so whatever's still
    // uncertain (or the standing "verify visually" note) still surfaces.
    leg._warnings = buildLegWarnings(leg);
  }

  return changes;
}

    ...findAmbiguousWords("origin", leg.origin || ""),
    ...findAmbiguousWords("destination", leg.destination || ""),
    ...findAmbiguousWords("origin_code", leg.origin_code || ""),
    ...findAmbiguousWords("destination_code", leg.destination_code || ""),

  return `
    <div style="font-family:var(--mono); font-size:11px; color:var(--muted); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.05em;">
      Resolving leg · ${esc(leg.leg_date)} · Invoice ${esc(invoiceNo)}
    </div>
    <div class="field-grid" style="margin-bottom:14px;">
      <div class="field"><div class="k">From</div><input style="${style}" data-field="origin" value="${esc(leg.origin || "")}"></div>
      <div class="field"><div class="k">From Code</div><input style="${style}" data-field="origin_code" value="${esc(leg.origin_code || "")}"></div>
      <div class="field"><div class="k">To</div><input style="${style}" data-field="destination" value="${esc(leg.destination || "")}"></div>

      <div class="field"><div class="k">Hours</div><input style="${style}" data-field="hours" value="${leg.hours ?? ""}"></div>
      <div class="field"><div class="k">Billed Hours</div><input style="${style}" data-field="billed_hours" value="${leg.billed_hours ?? ""}"></div>
      <div class="field"><div class="k">Distance (SM)</div><input style="${style}" data-field="distance_sm" value="${leg.distance_sm ?? ""}"></div>
    </div>
    ${ambiguousWords.length ? `
      <div style="margin-bottom:14px; padding:12px; background:var(--panel-2); border-radius:8px; border:1px solid var(--line);">
        <div style="font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px;">
          Possible character issue — this template has shown 'V' rendering as 'Y'. Pick the correct word for each:
        </div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          ${ambiguousWords.map((w, i) => `
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;" data-ambig-row data-field-name="${w.fieldName}" data-token-index="${w.tokenIndex}">
              <span style="font-size:12px; color:var(--muted); min-width:36px;">${esc(fieldLabel[w.fieldName])}:</span>
              <button class="btn" data-ambig-choice="original" data-value="${esc(w.original)}" style="font-family:var(--mono); background:var(--amber); border-color:var(--amber); color:#1A1200;">${esc(w.original)}</button>
              <span style="color:var(--muted); font-size:11px;">or</span>
              <button class="btn" data-ambig-choice="corrected" data-value="${esc(w.corrected)}" style="font-family:var(--mono);">${esc(w.corrected)}</button>
            </div>
          `).join("")}
        </div>
      </div>
    ` : ""}
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
      <button class="btn primary" data-action="save">Save changes &amp; resolve</button>
      <button class="btn" data-action="dismiss">Looks correct — resolve as-is</button>

    </div>
    <div data-error style="color:var(--red); font-size:12px; margin-top:10px; display:none;"></div>`;
}

function wireLegReviewBlock(container, invoiceNo, leg) {
  function showSummary() {
    container.innerHTML = renderLegSummaryHTML(leg);
    const resolveBtn = container.querySelector("[data-resolve-btn]");
    if (resolveBtn) resolveBtn.addEventListener("click", showEditForm);
  }

  function showEditForm() {
    container.innerHTML = renderLegEditFormHTML(invoiceNo, leg);

    const field = (name) => container.querySelector(`[data-field="${name}"]`);

    // Each ambiguous-word row has two buttons (original / corrected).
    // Clicking one replaces JUST that word (by token position) in the
    // live input value -- re-tokenizing fresh each time so this stays
    // correct even if the person has already hand-edited the field.
    container.querySelectorAll("[data-ambig-row]").forEach(row => {
      const fieldName = row.dataset.fieldName;
      const tokenIndex = parseInt(row.dataset.tokenIndex, 10);
      row.querySelectorAll("[data-ambig-choice]").forEach(btn => {
        btn.addEventListener("click", () => {
          const input = field(fieldName);
          const tokens = tokenizePreservingSpaces(input.value);
          if (tokens[tokenIndex] !== undefined) {
            tokens[tokenIndex] = btn.dataset.value;
            input.value = tokens.join("");
          }
          // Visually mark this row's chosen option -- amber = selected.
          row.querySelectorAll("[data-ambig-choice]").forEach(b => {
            const isChosen = b === btn;
            b.style.background = isChosen ? "var(--amber)" : "";
            b.style.borderColor = isChosen ? "var(--amber)" : "";
            b.style.color = isChosen ? "#1A1200" : "";
          });
        });
      });
    });

    // For code-field ambiguities specifically (From Code / To Code), try
    // to resolve them automatically against a real airport database
    // instead of leaving it as a pure guess: look up both candidates,
    // check which one's real city/state matches what's on this leg, and
    // if exactly one matches, pre-select it and label it as verified.
    container.querySelectorAll('[data-ambig-row][data-field-name="origin_code"], [data-ambig-row][data-field-name="destination_code"]').forEach(async (row) => {
      const fieldName = row.dataset.fieldName;
      const cityStateText = fieldName === "origin_code" ? field("origin").value : field("destination").value;
      const buttons = row.querySelectorAll("[data-ambig-choice]");
      const statusEl = document.createElement("span");
      statusEl.style.cssText = "font-size:11px; color:var(--muted);";
      statusEl.textContent = "Checking airport database…";
      row.appendChild(statusEl);

      const results = Array.from(buttons).map(btn => verifyAirportCode(btn.dataset.value, cityStateText));

      buttons.forEach((btn, i) => {
        const r = results[i];
        if (r.found) {
          const note = document.createElement("div");
          note.style.cssText = `font-size:10px; margin-top:3px; color:${r.cityMatch ? 'var(--teal)' : 'var(--muted)'};`;
          note.textContent = r.cityMatch
            ? `✓ ${r.name} (${r.municipality}, ${r.region})`
            : `${r.name} (${r.municipality}, ${r.region}) — different city`;
          btn.parentElement && btn.insertAdjacentElement("afterend", note);
        }
      });

      const matchIndex = results.findIndex(r => r.found && r.cityMatch);
      const otherMatchExists = results.filter(r => r.found && r.cityMatch).length > 1;
      if (matchIndex !== -1 && !otherMatchExists) {
        statusEl.textContent = "Matched against a small built-in airport list — recommended choice highlighted below.";
        buttons[matchIndex].click(); // auto-select the verified match

        // The database's municipality name is properly spaced/spelled --
        // offer to use it to fix the city text too, since this template's
        // text extraction sometimes drops spaces between words (e.g.
        // "STATECOLLEGE" for "State College") with no positional signal
        // this app can otherwise detect.
        const matchedRecord = results[matchIndex];
        const cityFieldName = fieldName === "origin_code" ? "origin" : "destination";
        const cityInput = field(cityFieldName);
        const currentVal = cityInput.value;
        const normCurrent = normalizeForMatch(currentVal);
        const normOfficial = normalizeForMatch(matchedRecord.municipality);
        if (normCurrent !== normOfficial) {
          const fixBtn = document.createElement("button");
          fixBtn.className = "btn";
          fixBtn.style.cssText = "margin-top:6px; font-size:11px;";
          fixBtn.textContent = `Fix city spelling → "${matchedRecord.municipality}"`;
          fixBtn.addEventListener("click", () => {
            const lastComma = currentVal.lastIndexOf(",");
            const statePart = lastComma !== -1 ? currentVal.slice(lastComma + 1).trim() : "";
            cityInput.value = statePart ? `${matchedRecord.municipality}, ${statePart}` : matchedRecord.municipality;
            fixBtn.disabled = true;
            fixBtn.textContent = "✓ City spelling fixed";
          });
          row.appendChild(fixBtn);
        }
      } else {
        statusEl.textContent = "Not in this app's small built-in airport list — pick manually, or check the separate airport_lookup_test.html tool for a full 78,000-airport search.";
      }
    });

    container.querySelector('[data-action="cancel"]').addEventListener("click", showSummary);

    async function doResolve(edits) {
      const errorEl = container.querySelector("[data-error]");
      const saveBtn = container.querySelector('[data-action="save"]');
      const dismissBtn = container.querySelector('[data-action="dismiss"]');
      saveBtn.disabled = true; dismissBtn.disabled = true;
      const result = await resolveLeg(invoiceNo, leg.id, edits);
      if (!result.ok) {
        errorEl.textContent = "Could not save: " + (result.error || "unknown error");
        errorEl.style.display = "block";
        saveBtn.disabled = false; dismissBtn.disabled = false;
        return;
      }
      toast("Leg resolved and removed from the review queue.", "success");
      renderReviewQueue(); // full refresh -- this leg no longer matches the filter
      refreshNavCounts().catch(e => console.error("refreshNavCounts after resolve failed:", e));
    }

    container.querySelector('[data-action="save"]').addEventListener("click", () => {
      const num = (v) => (v.trim() === "" ? null : parseFloat(v));
      doResolve({
        origin: field("origin").value.trim() || null,
        origin_code: field("origin_code").value.trim() || null,
        destination: field("destination").value.trim() || null,
        destination_code: field("destination_code").value.trim() || null,
        lead_passenger: field("lead_passenger").value.trim() || null,
        hours: num(field("hours").value),
        billed_hours: num(field("billed_hours").value),
        distance_sm: num(field("distance_sm").value),
      });
    });

    container.querySelector('[data-action="dismiss"]').addEventListener("click", () => doResolve({}));
  }

  showSummary();
}

async function renderReviewQueue() {
  main.innerHTML = `<div class="page-title">Review Queue</div><div class="page-sub">Legs the parser flagged as needing a human check. Resolve each one to remove it from this list.</div><div id="rq-container"><div class="card"><div class="empty-state">Loading…</div></div></div>`;
  const invoices = await getInvoicesCached();
  const container = document.getElementById("rq-container");

  // Auto-resolve pass: this covers legs from invoices saved BEFORE this
  // feature existed (or before the airport database had the right entry
  // yet) -- newly parsed invoices already went through this at parse
  // time, so this mostly catches older/pre-existing data. Only the owner
  // can trigger this, since it writes to shared storage -- a viewer's
  // Drive permission is read-only, so any write attempt on their behalf
  // would just fail (or worse, silently error) rather than helping.
  const allAutoChanges = []; // { invoiceNo, ...change }
  if (isOwner) {
    const invoicesToPersist = new Map(); // invoiceNo -> invoice object
    for (const inv of invoices) {
      for (const leg of (inv.flight_legs || [])) {
        if (!leg._warnings || !leg._warnings.length) continue;
        const changes = attemptAutoResolveLeg(leg);
        if (changes.length) {
          for (const c of changes) allAutoChanges.push({ invoiceNo: inv.invoice.invoice_id, ...c });
          invoicesToPersist.set(inv.invoice.invoice_id, inv);
        }
      }
    }
    for (const [invoiceNo, inv] of invoicesToPersist) {
      await Store.saveInvoice(invoiceNo, inv);
    }
    if (invoicesToPersist.size) {
      cachedInvoices = null;
      await recomputeReport().catch(e => console.error("recomputeReport after auto-resolve failed:", e));
    }
  }

  const groups = invoices.map(inv => ({
    invoice: inv.invoice,
    legs: (inv.flight_legs || []).filter(l => l._warnings && l._warnings.length),
  })).filter(g => g.legs.length);

  if (!groups.length) {
    container.innerHTML = `<div class="card"><div class="empty-state">Nothing needs review. 🎉</div></div>`;
    return;
  }

  container.innerHTML = groups.map(g => `
    <div class="invoice-group-title">Invoice ${esc(g.invoice.invoice_id)} — ${esc(g.invoice.period_start)}</div>
    ${g.legs.map(leg => `<div class="card" id="review-block-${esc(leg.id)}"></div>`).join("")}
  `).join("");

  for (const g of groups) {
    for (const leg of g.legs) {
      const block = document.getElementById(`review-block-${leg.id}`);
      if (block) wireLegReviewBlock(block, g.invoice.invoice_id, leg);
    }
  }
}

// ---- Resolved Issues ----
// Shows every leg that's been resolved (auto or manual), across all
// invoices, with full detail on what auto-resolve actually changed --
// this is where that detail lives now, rather than as transient banners
// on the Upload/Review Queue screens.
async function renderResolvedIssues() {
  main.innerHTML = `<div class="page-title">Resolved Issues</div><div class="page-sub">Ambiguities the app has resolved, automatically or manually, across every saved invoice.</div><div id="ri-container"><div class="card"><div class="empty-state">Loading…</div></div></div>`;
  const invoices = await getInvoicesCached();
  const container = document.getElementById("ri-container");

  const entries = []; // { invoiceNo, periodStart, leg }
  for (const inv of invoices) {
    for (const leg of (inv.flight_legs || [])) {
      if (leg._resolvedAt) entries.push({ invoiceNo: inv.invoice.invoice_id, periodStart: inv.invoice.period_start, leg });
    }
  }
  entries.sort((a, b) => (b.leg._resolvedAt || "").localeCompare(a.leg._resolvedAt || ""));

  if (!entries.length) {
    container.innerHTML = `<div class="card"><div class="empty-state">No resolved issues yet.</div></div>`;
    return;
  }

  container.innerHTML = entries.map(({ invoiceNo, periodStart, leg }) => {
    const changeLog = leg._autoResolveChangeLog || [];
    return `
      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
          <div style="font-family:var(--mono); font-size:13px;">
            Invoice ${esc(invoiceNo)} (${esc(periodStart)}) · Leg ${esc(leg.leg_date)} · ${esc(leg.origin)} → ${esc(leg.destination)}
          </div>
          <span style="font-size:11px; color:var(--muted);">
            ${leg._autoResolved ? "Auto-resolved" : "Manually resolved"} ${new Date(leg._resolvedAt).toLocaleString()}
          </span>
        </div>
        ${changeLog.length ? `
          <div style="display:flex; flex-direction:column; gap:8px; font-size:12px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);">
            ${changeLog.map((c, i) => `
              <div data-ri-invoice="${esc(invoiceNo)}" data-ri-leg="${esc(leg.id)}" data-ri-change-index="${i}" style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
                <div style="color:var(--muted);">
                  <span style="color:var(--text);">${esc(c.field)}</span>: "${esc(c.oldValue)}" → "${esc(c.newValue)}"
                  <div style="font-size:10px; color:var(--muted);">${esc(c.reason)}</div>
                </div>
                ${isOwner ? '<button class="btn" data-ri-undo style="font-size:10px; padding:3px 8px; flex-shrink:0;">Undo</button>' : ''}
              </div>
            `).join("")}
          </div>
        ` : `<div style="font-size:12px; color:var(--muted); margin-top:6px;">Resolved manually — no automatic change detail recorded.</div>`}
      </div>
    `;
  }).join("");

  container.querySelectorAll("[data-ri-undo]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const row = btn.closest("[data-ri-change-index]");
      const invoiceNo = row.dataset.riInvoice;
      const legId = row.dataset.riLeg;
      const changeIndex = parseInt(row.dataset.riChangeIndex, 10);
      btn.disabled = true;
      btn.textContent = "Undoing…";

      const inv = await Store.getInvoice(invoiceNo);
      if (!inv) return;
      const leg = (inv.flight_legs || []).find(l => l.id === legId);
      if (!leg) return;
      const change = (leg._autoResolveChangeLog || [])[changeIndex];
      if (!change) return;

      leg[change.field] = change.oldValue;
      leg._autoResolveChangeLog.splice(changeIndex, 1);
      leg._warnings = buildLegWarnings(leg);
      leg._autoResolved = false;
      delete leg._resolvedAt;

      await Store.saveInvoice(invoiceNo, inv);
      cachedInvoices = null;
      await recomputeReport().catch(e => console.error("recomputeReport after undo failed:", e));
      renderResolvedIssues();
      refreshNavCounts().catch(e => console.error("refreshNavCounts after undo failed:", e));
    });
  });
}

// Persists a single field change on a specific leg back to its invoice in
// Drive. Used by both the Flight Type dropdown and Notes field so edits
// made directly in the passenger report save immediately.
async function saveLegField(invoiceNo, legId, field, value) {
  const inv = await Store.getInvoice(invoiceNo);
  if (!inv) return { ok: false, error: `Invoice ${invoiceNo} not found` };
  const leg = (inv.flight_legs || []).find(l => l.id === legId);
  if (!leg) return { ok: false, error: `Leg ${legId} not found` };
  leg[field] = value || null;
  const result = await Store.saveInvoice(invoiceNo, inv);
  if (result.ok) cachedInvoices = null;
  return result;
}

// Wires the Flight Type / Notes inputs within a just-rendered passenger
// report container. Flight Type saves on change (a discrete selection);
// Notes saves on blur (not every keystroke) so typing isn't interrupted
// and the save doesn't fire until the person is done with that field.
// Returns years (descending) for which this passenger has at least one
// month of data, derived from each month's "YYYY-MM" key.
function getPassengerYears(p) {
  const years = new Set(p.months.map(m => m.monthKey.split("-")[0]).filter(y => y !== "0000"));
  return [...years].sort((a, b) => b.localeCompare(a));
}

// Builds and downloads a real .xlsx file for one passenger/year, using
// the same Flight Log (summary) fields shown on screen, in chronological
// order across the whole year (not grouped by month).
function exportPassengerYearToXlsx(p, year) {
  const rows = [];
  const monthsInYear = p.months
    .filter(m => m.monthKey.startsWith(year + "-"))
    .sort((a, b) => a.monthKey.localeCompare(b.monthKey));
  for (const m of monthsInYear) {
    for (const t of m.trips) rows.push(t);
  }
  // Trips within a month are already date-sorted (see recomputeReport);
  // months themselves are already in chronological order above, so this
  // list is already fully chronological for the year.

  const title = `${p.name} Flight Log ${year}`;
  const header = ["Date", "From", "To", "Billed Hours", "Hourly Charge", "Fuel Charge", "Total Billed", "Invoice", "Flight Type", "Notes"];
  const dataRows = rows.map(t => [t.date || "", t.from || "", t.to || "", t.billedHours != null ? t.billedHours : "", t.hourlyTotal != null ? t.hourlyTotal : "", t.fuelTotal != null ? t.fuelTotal : "", t.totalCharges != null ? t.totalCharges : "", t.invoiceNo || "", t.flightType || "", t.notes || ""]);

  // Legend explaining each Flight Type abbreviation, placed a couple of
  // blank rows below the data.
  const legendTitleRow = 3 + dataRows.length + 2; // header at row 2 (0-indexed), data starts row 3
  const aoa = [
    [title], [], header, ...dataRows,
    [], [],
    ["Flight Type Legend"],
    ...FLIGHT_TYPES.map(ft => [ft.abbr, ft.label]),
  ];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!merges"] = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: header.length - 1 } },
    { s: { r: legendTitleRow, c: 0 }, e: { r: legendTitleRow, c: header.length - 1 } },
  ];
  ws["!cols"] = [{ wch: 10 }, { wch: 22 }, { wch: 22 }, { wch: 12 }, { wch: 13 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 12 }, { wch: 50 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, year);
  const safeName = p.name.replace(/[^a-z0-9]+/gi, "_");
  XLSX.writeFile(wb, `${safeName}_Flight_Log_${year}.xlsx`);
}

function wirePassengerReportEditableFields(container, passengers) {
  // Editing a field saves to Drive, but the in-memory `passengers`
  // structure (captured by Export Report's closure) wasn't being updated
  // to match -- meaning exports could read stale (pre-edit) values even
  // though storage itself was correct. Update the matching trip object
  // directly on successful save so both the Export button and any other
  // in-memory use of this data stay in sync without needing a full
  // re-render (which would disrupt whatever the person is doing).
  function findTripInPassengers(invoiceNo, legId) {
    for (const p of passengers) {
      for (const m of p.months) {
        const t = m.trips.find(t => t.invoiceNo === invoiceNo && t.legId === legId);
        if (t) return t;
      }
    }
    return null;
  }

  container.querySelectorAll("[data-ft-toggle]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const menu = btn.closest("[data-ft-wrapper]").querySelector("[data-ft-menu]");
      const isOpen = menu.style.display !== "none";
      container.querySelectorAll("[data-ft-menu], [data-export-years-menu]").forEach(m => m.style.display = "none");
      menu.style.display = isOpen ? "none" : "block";
    });
  });
  container.querySelectorAll("[data-ft-option]").forEach(opt => {
    opt.addEventListener("click", async (e) => {
      e.stopPropagation();
      const wrapper = opt.closest("[data-ft-wrapper]");
      const { invoice, leg } = wrapper.dataset;
      const abbr = opt.dataset.abbr;
      const toggleBtn = wrapper.querySelector("[data-ft-toggle]");
      const menu = wrapper.querySelector("[data-ft-menu]");
      toggleBtn.disabled = true;
      const result = await saveLegField(invoice, leg, "flight_type", abbr);
      toggleBtn.disabled = false;
      if (!result.ok) {
        toast(`Could not save flight type: ${result.error || "unknown error"}`, "error");
        return;
      }
      toggleBtn.textContent = abbr || "—";
      menu.style.display = "none";
      const trip = findTripInPassengers(invoice, leg);
      if (trip) trip.flightType = abbr;
    });
  });
  container.querySelectorAll("[data-notes]").forEach(input => {
    let lastSaved = input.value;
    input.addEventListener("blur", async () => {
      if (input.value === lastSaved) return; // nothing changed, skip the write
      const { invoice, leg } = input.dataset;
      const result = await saveLegField(invoice, leg, "notes", input.value);
      if (!result.ok) {
        toast(`Could not save notes: ${result.error || "unknown error"}`, "error");
        return;
      }
      lastSaved = input.value;
      const trip = findTripInPassengers(invoice, leg);
      if (trip) trip.notes = input.value;
    });
  });

  // Export Report button toggles a small year-picker menu; picking a year
  // generates and downloads the .xlsx file directly (no server involved).
  container.querySelectorAll("[data-export-report]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const menu = container.querySelector(`[data-export-years-menu][data-passenger="${btn.dataset.passenger}"]`);
      const isOpen = menu.style.display !== "none";
      container.querySelectorAll("[data-export-years-menu]").forEach(m => m.style.display = "none");
      menu.style.display = isOpen ? "none" : "block";
    });
  });
  container.querySelectorAll("[data-export-year]").forEach(btn => {
    btn.addEventListener("click", () => {
      const p = passengers.find(p => p.name === btn.dataset.passenger);
      if (p) exportPassengerYearToXlsx(p, btn.dataset.exportYear);
      btn.closest("[data-export-years-menu]").style.display = "none";
    });
  });
  document.addEventListener("click", () => {
    container.querySelectorAll("[data-export-years-menu], [data-ft-menu]").forEach(m => m.style.display = "none");
  });
}

const PASSENGER_FILTERS = {
  totals: { label: "Totals", title: "Reports", sub: "Billed hours by lead passenger, across every saved invoice.", match: null },
  kagan: { label: "Kagan", title: "Reports — Kagan", sub: "Legs with Jon Kagan as lead passenger.", match: "Jon Kagan" },
  lopata: { label: "Lopata", title: "Reports — Lopata", sub: "Legs with Rob Lopata as lead passenger.", match: "Rob Lopata" },
};

// Hours Summary: a running-balance report specific to Jon Kagan and Rob
// Lopata, tracking each against a fixed 25-hour starting allocation as
// invoices are billed against it. Unlike the other report modes, this
// isn't per-passenger -- it always shows both people side by side,
// regardless of the Totals/Kagan/Lopata filter currently selected.
const HOURS_SUMMARY_PEOPLE = ["Jon Kagan", "Rob Lopata"];
const HOURS_SUMMARY_STARTING_HOURS = 25;

function parseSlashDate(s) {
  if (!s) return null;
  const parts = s.split("/");
  if (parts.length !== 3) return null;
  const [mm, dd, yearRaw] = parts;
  // Contract year dates are stored as mm/dd/yy (2-digit year), but the
  // Date constructor treats a bare 2-digit year as 1900+year (e.g. 25
  // becomes 1925, not 2025) -- expand it explicitly rather than relying
  // on that legacy behavior, which silently broke all date comparisons
  // against these fields.
  const year = yearRaw.length === 2 ? 2000 + Number(yearRaw) : Number(yearRaw);
  const d = new Date(year, Number(mm) - 1, Number(dd));
  return isNaN(d.getTime()) ? null : d;
}

async function buildHoursSummaryHTML(report, filterKey = "totals") {
  const invoices = await getInvoicesCached();
  if (!invoices.length) {
    return `<div class="card"><div class="empty-state">No invoices yet.</div></div>`;
  }

  const sortedInvoices = [...invoices].sort((a, b) => {
    const da = parseSlashDate(a.invoice.period_start);
    const db = parseSlashDate(b.invoice.period_start);
    return (da && db) ? da - db : 0;
  });

  // "The starting date for year 1 from the earliest invoice" -- the
  // contract_year_snapshots' own period_start/period_end are already
  // stored as mm/dd/yy (confirmed against real data), so no reformatting
  // needed. Pull all 5 years (not just Year 1) to build the grouping
  // buckets requested.
  const earliestInvoice = sortedInvoices[0];
  const yearSnapshots = ["Year 1", "Year 2", "Year 3", "Year 4", "Year 5"].map(label =>
    (earliestInvoice.contract_year_snapshots || []).find(y => y.period_label === label)
  );

  function billedHoursForInvoice(personName, invoiceNo) {
    const p = report.passengers.find(pp => pp.name === personName);
    if (!p) return 0;
    let sum = 0;
    for (const m of p.months) {
      for (const t of m.trips) {
        if (t.invoiceNo === invoiceNo) sum += (t.billedHours || 0);
      }
    }
    return round2(sum);
  }

  // Individual leg-level entries for one invoice, across both people --
  // used by "Show Detail" mode. Each leg belongs to exactly one person
  // (its lead passenger), so only that person's column gets a value.
  function legDetailsForInvoice(invoiceNo) {
    const legs = [];
    for (const personName of HOURS_SUMMARY_PEOPLE) {
      const p = report.passengers.find(pp => pp.name === personName);
      if (!p) continue;
      for (const m of p.months) {
        for (const t of m.trips) {
          if (t.invoiceNo === invoiceNo) legs.push({ ...t, personName });
        }
      }
    }
    legs.sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    return legs;
  }

  // Leg dates are stored as "MM/DD" with no year; combine with a
  // reference year (the invoice's own) to get a comparable full date for
  // the Year N boundary check.
  function legFullDate(legDateMMDD, referenceYear) {
    if (!legDateMMDD) return null;
    const [mm, dd] = legDateMMDD.split("/");
    if (!mm || !dd) return null;
    const d = new Date(referenceYear, Number(mm) - 1, Number(dd));
    return isNaN(d.getTime()) ? null : d;
  }

  const invoiceRows = sortedInvoices.map(inv => {
    const d = parseSlashDate(inv.invoice.period_start);
    const endDate = parseSlashDate(inv.invoice.period_end);
    const monthName = d ? d.toLocaleString("en-US", { month: "long" }) : "";
    const jonHours = billedHoursForInvoice(HOURS_SUMMARY_PEOPLE[0], inv.invoice.invoice_id);
    const robHours = billedHoursForInvoice(HOURS_SUMMARY_PEOPLE[1], inv.invoice.invoice_id);
    return {
      date: d, endDate, label: `${monthName} Invoice`, jon: jonHours, rob: robHours, total: round2(jonHours + robHours),
      invoiceNo: inv.invoice.invoice_id, referenceYear: d ? d.getFullYear() : null,
    };
  });

  // Group each invoice row into whichever contract year's date range its
  // invoice period falls within, so entries render chronologically under
  // the correct "Year N" heading.
  const yearBuckets = yearSnapshots.map((y, i) => {
    const start = y ? parseSlashDate(y.period_start) : null;
    const end = y ? parseSlashDate(y.period_end) : null;
    return { snapshot: y, yearNumber: i + 1, start, end, rows: [] };
  });
  for (const row of invoiceRows) {
    const bucket = yearBuckets.find(b => b.start && b.end && row.endDate && row.endDate >= b.start && row.endDate <= b.end);
    if (bucket) bucket.rows.push(row);
    else if (yearBuckets.length) yearBuckets[yearBuckets.length - 1].rows.push(row); // fallback: shouldn't normally happen
  }

  // Don't show (or count allotted hours for) contract years that haven't
  // started yet -- a future year's hours haven't actually been allotted
  // in any real sense, so both the report rows and the Remaining Hours
  // math below only consider years whose start date has already passed.
  const today = new Date();
  const startedYearBuckets = yearBuckets.filter(b => b.snapshot && b.start && b.start <= today);

  // Remaining Hours = every STARTED contract year's allotment (25 each,
  // credited once per year regardless of whether that year has invoices
  // yet) minus everything billed to date across all invoices.
  const yearsWithSnapshot = startedYearBuckets.length;
  const totalJonBilled = invoiceRows.reduce((sum, r) => sum + r.jon, 0);
  const totalRobBilled = invoiceRows.reduce((sum, r) => sum + r.rob, 0);
  const subtotalJon = round2(yearsWithSnapshot * HOURS_SUMMARY_STARTING_HOURS - totalJonBilled);
  const subtotalRob = round2(yearsWithSnapshot * HOURS_SUMMARY_STARTING_HOURS - totalRobBilled);

  // Which columns to show depends on the Totals/Kagan/Lopata filter --
  // Kagan/Lopata views show only that person (no Total column, since a
  // total of one person isn't meaningful); Totals shows all three.
  const showJon = filterKey !== "lopata";
  const showRob = filterKey !== "kagan";
  const showTotal = filterKey === "totals";
  const visibleDataColumns = (showJon ? 1 : 0) + (showRob ? 1 : 0) + (showTotal ? 1 : 0);

  const colWidths = ["340px"];
  const headerCells = [""];
  if (showJon) { colWidths.push("150px"); headerCells.push(esc(HOURS_SUMMARY_PEOPLE[0])); }
  if (showRob) { colWidths.push("150px"); headerCells.push(esc(HOURS_SUMMARY_PEOPLE[1])); }
  if (showTotal) { colWidths.push("150px"); headerCells.push("Total"); }

  function rowCells(jonVal, robVal, totalVal) {
    const cells = [];
    if (showJon) cells.push(`<td>${fmtNum(jonVal, 2)}</td>`);
    if (showRob) cells.push(`<td>${fmtNum(robVal, 2)}</td>`);
    if (showTotal) cells.push(`<td>${fmtNum(totalVal, 2)}</td>`);
    return cells.join("");
  }
  const ALLOTTED_GREEN = "#4CAF50";
  function allottedRowCells(jonVal, robVal, totalVal) {
    const cells = [];
    if (showJon) cells.push(`<td style="color:${ALLOTTED_GREEN};">+${fmtNum(jonVal, 2)}</td>`);
    if (showRob) cells.push(`<td style="color:${ALLOTTED_GREEN};">+${fmtNum(robVal, 2)}</td>`);
    if (showTotal) cells.push(`<td style="color:${ALLOTTED_GREEN};">+${fmtNum(totalVal, 2)}</td>`);
    return cells.join("");
  }
  function boldRowCells(jonVal, robVal, totalVal) {
    const cells = [];
    if (showJon) cells.push(`<td style="font-weight:600;">${fmtNum(jonVal, 2)}</td>`);
    if (showRob) cells.push(`<td style="font-weight:600;">${fmtNum(robVal, 2)}</td>`);
    if (showTotal) cells.push(`<td style="font-weight:600;">${fmtNum(totalVal, 2)}</td>`);
    return cells.join("");
  }
  // A single leg belongs to exactly one passenger, so only that person's
  // column gets a value -- the other shows blank rather than 0, to make
  // clear it simply isn't this leg's passenger (not a zero-hour leg).
  function legRowCells(leg) {
    const jonVal = leg.personName === HOURS_SUMMARY_PEOPLE[0] ? leg.billedHours : null;
    const robVal = leg.personName === HOURS_SUMMARY_PEOPLE[1] ? leg.billedHours : null;
    const totalVal = leg.billedHours;
    const cells = [];
    if (showJon) cells.push(`<td>${jonVal != null ? fmtNum(jonVal, 2) : ""}</td>`);
    if (showRob) cells.push(`<td>${robVal != null ? fmtNum(robVal, 2) : ""}</td>`);
    if (showTotal) cells.push(`<td>${fmtNum(totalVal, 2)}</td>`);
    return cells.join("");
  }

  return `
    <div class="card">
      <div style="display:flex; justify-content:flex-end; margin-bottom:14px;">
        <button class="btn" id="hs-detail-toggle">${hoursSummaryShowDetail ? "Hide Detail" : "Show Detail"}</button>
      </div>
      <table class="report-table">
        <colgroup>${colWidths.map(w => `<col style="width:${w};">`).join("")}</colgroup>
        <thead><tr>${headerCells.map(h => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>
          ${startedYearBuckets.map(bucket => `
            <tr style="background:var(--panel-2);">
              <td colspan="${1 + visibleDataColumns}" style="font-family:var(--mono); font-size:18px; font-weight:700; color:var(--amber);">
                Year ${bucket.yearNumber} (${esc(bucket.snapshot.period_start)} – ${esc(bucket.snapshot.period_end)})
              </td>
            </tr>
            <tr style="background:rgba(76,175,80,0.12);">
              <td style="color:${ALLOTTED_GREEN};">Allotted Hours</td>
              ${allottedRowCells(HOURS_SUMMARY_STARTING_HOURS, HOURS_SUMMARY_STARTING_HOURS, HOURS_SUMMARY_STARTING_HOURS * 2)}
            </tr>
            ${bucket.rows.map(r => {
              const isExpanded = hoursSummaryShowDetail || hoursSummaryExpandedInvoices.has(r.invoiceNo);
              if (isExpanded) {
                const legRows = legDetailsForInvoice(r.invoiceNo)
                  .filter(leg => (showJon && leg.personName === HOURS_SUMMARY_PEOPLE[0]) || (showRob && leg.personName === HOURS_SUMMARY_PEOPLE[1]))
                  .filter(leg => {
                    const legDate = legFullDate(leg.date, r.referenceYear);
                    return legDate && bucket.start && bucket.end && legDate >= bucket.start && legDate <= bucket.end;
                  })
                  .map(leg => `
                    <tr>
                      <td>${esc(leg.date)} · ${esc(leg.from)} → ${esc(leg.to)}</td>
                      ${legRowCells(leg)}
                    </tr>`).join("");
                return `
                  <tr>
                    <td colspan="${1 + visibleDataColumns}" style="font-weight:700; color:var(--text); cursor:pointer;" data-hs-invoice-toggle="${esc(r.invoiceNo)}">${esc(r.label)} ▾</td>
                  </tr>
                  ${legRows}`;
              }
              return `
                <tr>
                  <td style="cursor:pointer;" data-hs-invoice-toggle="${esc(r.invoiceNo)}">${esc(r.label)} ▸</td>
                  ${rowCells(r.jon, r.rob, r.total)}
                </tr>`;
            }).join("")}
          `).join("")}
          <tr style="background:var(--panel-2);">
            <td style="font-family:var(--mono); font-size:18px; font-weight:700; color:var(--amber);">Remaining Hours</td>

function inferReservationYear(monthDayStr, emailInternalDateMs) {
  if (!monthDayStr || !emailInternalDateMs) return null;
  const emailDate = new Date(Number(emailInternalDateMs));
  const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const monthIndex = monthNames.indexOf(monthDayStr.split(" ")[0]);
  if (monthIndex === -1) return null;
  // A reservation's month landing "before" the month the confirmation was
  // emailed almost always means it's for next year, not the past --
  // confirmations arrive ahead of travel, not after it.
  return monthIndex >= emailDate.getMonth() ? emailDate.getFullYear() : emailDate.getFullYear() + 1;
}

async function renderPsInvoices() {
  main.innerHTML = `
    <div class="page-title">P/S Invoices</div>
    <div class="page-sub">Every P/S receipt email, chronologically.</div>
    <div id="psinvoices-card"><div class="card"><div class="empty-state">Loading…</div></div></div>
  `;
  const container = document.getElementById("psinvoices-card");
  const deductions = await Store.listPsBalanceDeductions();
  const reservations = await Store.listReservations();

  function parseServiceDate(d) {
    if (!d) return null;
    const [mm, dd, yyyy] = d.split("/");
    if (!mm || !dd || !yyyy) return null;
    const date = new Date(Number(yyyy), Number(mm) - 1, Number(dd));
    return isNaN(date.getTime()) ? null : date;
  }

  // Same grouping as PS Balance -- each receipt email is one invoice,
  // with its own line items.
  const groupsByMessageId = new Map();
  for (const d of deductions) {
    if (!groupsByMessageId.has(d.gmailMessageId)) {
      groupsByMessageId.set(d.gmailMessageId, { gmailMessageId: d.gmailMessageId, reservationNumber: d.reservationNumber, dateOfService: d.dateOfService, emailInternalDate: d.emailInternalDate, primaryTraveler: d.primaryTraveler });
    }
  }
  const groups = [...groupsByMessageId.values()];

  const rows = groups.map(g => {
    const matchingReservation = reservations.find(r => r.reservationNumber === g.reservationNumber);
    const route = matchingReservation ? `${matchingReservation.origin || "?"} → ${matchingReservation.destination || "?"}` : "—";
    const sortDate = parseServiceDate(g.dateOfService) || (g.emailInternalDate ? new Date(Number(g.emailInternalDate)) : null);
    return { ...g, route, sortDate };
  });
  rows.sort((a, b) => {
    if (a.sortDate && b.sortDate) return a.sortDate - b.sortDate;
    if (a.sortDate) return -1;
    if (b.sortDate) return 1;
    return 0;
  });

  if (!rows.length) {
    container.innerHTML = `<div class="card"><div class="empty-state">No invoices yet.</div></div>`;
    return;
  }

  container.innerHTML = `
    <div class="card">
      <table class="report-table">
        <colgroup><col style="width:150px;"><col style="width:150px;"><col style="width:200px;"><col></colgroup>
        <thead><tr><th>Date</th><th>Reservation #</th><th>Route</th><th>Lead Passenger</th></tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr data-psinvoice-row="${esc(r.gmailMessageId)}" style="cursor:pointer;">
              <td>${esc(r.dateOfService) || "—"}</td>
              <td>${esc(r.reservationNumber)}</td>
              <td>${esc(r.route)}</td>
              <td>${esc(r.primaryTraveler) || "—"}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
  container.querySelectorAll("[data-psinvoice-row]").forEach(row => {
    row.addEventListener("click", () => navigate("psinvoicedetail", row.dataset.psinvoiceRow));
  });
}
