async function renderPsBalanceTable(showDeleteControls = false) {
  const container = document.getElementById("psbalance-card");
  const deductions = await Store.listPsBalanceDeductions();

  function parseServiceDate(d) {
    if (!d) return null;
    const [mm, dd, yyyy] = d.split("/");
    if (!mm || !dd || !yyyy) return null;
    const date = new Date(Number(yyyy), Number(mm) - 1, Number(dd));
    return isNaN(date.getTime()) ? null : date;
  }
  function groupDate(group) {
    return parseServiceDate(group.dateOfService) || (group.emailInternalDate ? new Date(Number(group.emailInternalDate)) : null);
  }

  // Group line items back into their originating receipt/invoice --
  // each invoice gets one header row (date + reservation #, no dollar
  // amounts), with its own line items listed underneath.
  const groupsByMessageId = new Map();
  for (const d of deductions) {
    if (!groupsByMessageId.has(d.gmailMessageId)) {
      groupsByMessageId.set(d.gmailMessageId, {
        gmailMessageId: d.gmailMessageId,
        reservationNumber: d.reservationNumber,
        dateOfService: d.dateOfService,
        emailInternalDate: d.emailInternalDate,
        personKey: d.personKey,
        items: [],
      });
    }
    groupsByMessageId.get(d.gmailMessageId).items.push(d);
  }
  const groups = [...groupsByMessageId.values()].sort((a, b) => {
    const aDate = groupDate(a), bDate = groupDate(b);
    if (aDate && bDate) return aDate - bDate;
    if (aDate) return -1;
    if (bDate) return 1;
    return 0;
  });

  let jonRemaining = PS_BALANCE_OPENING;
  let robRemaining = PS_BALANCE_OPENING;
  for (const g of groups) {
    for (const item of g.items) {
      if (g.personKey === "jon") jonRemaining -= item.deductionAmount;
      else if (g.personKey === "rob") robRemaining -= item.deductionAmount;
    }
  }

  container.innerHTML = `
    <div class="card">
      <table class="report-table">
        <colgroup><col style="width:260px;"><col style="width:150px;"><col style="width:150px;"><col style="width:150px;"></colgroup>
        <thead><tr><th></th><th>${esc(PS_BALANCE_PEOPLE[0])}</th><th>${esc(PS_BALANCE_PEOPLE[1])}</th><th>Total</th></tr></thead>
        <tbody>
          <tr>
            <td>Opening Balance</td>
            <td>${fmtMoney(PS_BALANCE_OPENING)}</td>
            <td>${fmtMoney(PS_BALANCE_OPENING)}</td>
            <td>${fmtMoney(PS_BALANCE_OPENING * 2)}</td>
          </tr>
          ${groups.map(g => `
            <tr style="background:var(--panel-2);">
              <td colspan="4" style="font-family:var(--mono); font-weight:700; color:var(--text);">
                <span data-psbal-goto-detail="${esc(g.gmailMessageId)}" style="cursor:pointer;">
                  ${g.dateOfService ? esc(g.dateOfService) : ""} — Reservation #${esc(g.reservationNumber)}
                </span>
                ${isOwner && showDeleteControls ? `<button class="btn danger" data-psbal-delete-group data-id="${esc(g.gmailMessageId)}" style="font-size:10px; padding:2px 6px; margin-left:8px;">Delete</button>` : ''}
              </td>
            </tr>
            ${g.items.map(item => {
              const jonAmt = g.personKey === "jon" ? item.deductionAmount : 0;
              const robAmt = g.personKey === "rob" ? item.deductionAmount : 0;
              // Description already includes "LAX Reservation #:" -- drop
              // that now-redundant prefix since the header row above
              // already shows the reservation number.
              const shortDescription = (item.description || "(no description — from an older sync, clear and re-sync to fix)").replace(/^LAX Reservation \d+:\s*/, "");
              return `
                <tr>
                  <td style="padding-left:24px;">${esc(shortDescription)}</td>
                  <td>${jonAmt ? "-" + fmtMoney(jonAmt) : ""}</td>
                  <td>${robAmt ? "-" + fmtMoney(robAmt) : ""}</td>
                  <td>${(jonAmt + robAmt) ? "-" + fmtMoney(jonAmt + robAmt) : ""}</td>
                </tr>`;
            }).join("")}
          `).join("")}
          <tr style="background:var(--panel-2);">
            <td style="font-family:var(--mono); font-size:18px; font-weight:700; color:var(--amber);">Remaining Balance</td>
            <td style="font-weight:600;">${fmtMoney(jonRemaining)}</td>
            <td style="font-weight:600;">${fmtMoney(robRemaining)}</td>
            <td style="font-weight:600;">${fmtMoney(jonRemaining + robRemaining)}</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;

  if (isOwner && showDeleteControls) {
    container.querySelectorAll("[data-psbal-delete-group]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation(); // don't also trigger the row's navigate-to-detail click
        btn.disabled = true;
        btn.textContent = "Deleting…";
        const ok = await Store.deletePsBalanceGroup(btn.dataset.id);
        if (!ok) {
          toast("Could not delete — storage error. Please try again.", "error");
        }
        renderPsBalanceTable(showDeleteControls);
      });
    });
  }

  container.querySelectorAll("[data-psbal-goto-detail]").forEach(el => {
    el.addEventListener("click", () => {
      navigate("psinvoicedetail", el.dataset.psbalGotoDetail);
    });
  });
}

async function renderReservationsList() {
  const container = document.getElementById("reservations-card");
  const reservations = await Store.listReservations();

  if (!reservations.length) {
    container.innerHTML = `<div class="card"><div class="empty-state">No reservations yet.${isOwner ? ' Click "Sync from Email" to check for confirmations.' : ''}</div></div>`;
    return;
  }

  const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const withYear = reservations.map(r => {
    const inferredYear = inferReservationYear(r.date, r.emailInternalDate);
    // Build an actual sortable Date -- comparing the raw month-name text
    // (e.g. "April" vs "January") sorts alphabetically, not
    // chronologically, which would put April before January.
    let sortDate = null;
    if (r.date && inferredYear) {
      const [monthName, dayStr] = r.date.split(" ");
      const monthIndex = MONTH_NAMES.indexOf(monthName);
      if (monthIndex !== -1) sortDate = new Date(inferredYear, monthIndex, Number(dayStr) || 1);
    }
    return { ...r, inferredYear, sortDate };
  });
  withYear.sort((a, b) => {
    if (a.sortDate && b.sortDate) return a.sortDate - b.sortDate;
    if (a.sortDate) return -1;
    if (b.sortDate) return 1;
    return 0;
  });

  container.innerHTML = withYear.map(r => `
    <div class="card" style="margin-bottom:14px;">
      <div style="font-family:var(--mono); font-size:14px; color:var(--amber); font-weight:700;">
        ${esc(r.date)}${r.inferredYear ? ", " + r.inferredYear : ""}${r.arriveByTime ? ` (arrive by ${esc(r.arriveByTime)})` : ""} • ${esc(r.reservationNumber)} • ${esc(r.experience)}
      </div>
      <div style="margin-top:6px; font-size:13px; color:var(--text); display:flex; flex-wrap:wrap; gap:6px 14px;">
        <span>${esc(r.airline)} #${esc(r.flightNumber)}</span>
        <span>Departs: ${esc(r.departureAirport)} ${esc(r.departureTime)}</span>
        <span>Arrives: ${esc(r.arrivalAirport)} ${esc(r.arrivalTime)}</span>
      </div>
      <div style="margin-top:6px; font-size:13px; color:var(--muted);">
        Travelers: ${(r.travelers || []).map(t => esc(t.name) + (t.primary ? ' (Primary)' : '')).join(', ')}
      </div>
      <div style="margin-top:6px; font-size:13px; color:var(--text);">
        Reservation #${esc(r.reservationNumber)} — ${esc(r.status)}
      </div>
      ${isOwner ? `
        <div style="margin-top:10px; display:flex; gap:8px; align-items:flex-start;">
          <div style="position:relative; display:inline-block;">
            <button class="btn" data-view-emails-toggle="${esc(r.reservationNumber)}" ${(() => {
              const seen = r.seenMessages || [{ messageId: r.gmailMessageId, threadId: r.gmailThreadId, rfc822MessageId: r.rfc822MessageId }];
              return seen.length === 1 && seen[0].rfc822MessageId ? `data-single-rfc822="${esc(encodeURIComponent(seen[0].rfc822MessageId))}"` : "";
            })()} style="font-size:11px; padding:3px 8px;">
              View Email${(r.seenMessages || []).length === 1 ? "" : "s"} (${(r.seenMessages || [{ messageId: r.gmailMessageId, threadId: r.gmailThreadId }]).length})
            </button>
            <div data-view-emails-list="${esc(r.reservationNumber)}" style="display:none; position:absolute; top:100%; left:0; margin-top:4px; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:10px; z-index:10; min-width:280px; font-size:12px;">
              ${(r.seenMessages || [{ messageId: r.gmailMessageId, threadId: r.gmailThreadId, rfc822MessageId: r.rfc822MessageId }]).map(s => `
                <div style="margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--line);">
                  <div style="color:var(--text); margin-bottom:4px;">${s.messageId === r.gmailMessageId ? "Current" : "Superseded"}:</div>
                  ${s.rfc822MessageId ? `
                    <a href="https://mail.google.com/mail/u/0/#search/rfc822msgid:${esc(encodeURIComponent(s.rfc822MessageId))}" target="_blank" rel="noopener" style="color:var(--amber);">Open in Gmail</a>
                  ` : `<span style="color:var(--muted);">Run "Re-parse All" to enable a link for this older entry.</span>`}
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      ` : ''}
    </div>
  `).join("");

  if (isOwner) {
    container.querySelectorAll("[data-view-emails-toggle]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const singleRfc822 = btn.dataset.singleRfc822;
        if (singleRfc822) {
          window.open(`https://mail.google.com/mail/u/0/#search/rfc822msgid:${singleRfc822}`, "_blank", "noopener");
          return;
        }
        const key = btn.dataset.viewEmailsToggle;
        const list = container.querySelector(`[data-view-emails-list="${key}"]`);
        const isOpen = list.style.display !== "none";
        container.querySelectorAll("[data-view-emails-list]").forEach(l => l.style.display = "none");
        list.style.display = isOpen ? "none" : "block";
      });
    });
    document.addEventListener("click", () => {
      container.querySelectorAll("[data-view-emails-list]").forEach(l => l.style.display = "none");
    });
  }
}

let trendChart = null;
async function renderTrends() {
  main.innerHTML = `
    <div class="page-title">Trends</div>
    <div class="page-sub">Monthly spend and hours usage across all saved invoices.</div>
    <div class="card"><canvas id="trend-canvas" height="90"></canvas></div>
  `;
  const invoices = await getInvoicesCached();
  if (!invoices.length) {
    document.querySelector(".card").innerHTML = `<div class="empty-state">No invoices yet.</div>`;
    return;
  }
  const sorted = [...invoices].sort((a, b) => (a.invoice.period_start || '').localeCompare(b.invoice.period_start || ''));
  const labels = sorted.map(inv => inv.invoice.period_start);
  const spend = sorted.map(inv => inv.invoice.total_invoice_amount);
  const usage = sorted.map(inv => inv.invoice.avg_actual_usage_per_month);

  const ctx = document.getElementById("trend-canvas");
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Total invoice ($)', data: spend, backgroundColor: '#E3A438', yAxisID: 'y' },
        { label: 'Avg usage (hrs/mo)', data: usage, type: 'line', borderColor: '#4FB8AE', backgroundColor: '#4FB8AE', yAxisID: 'y1' },
      ]
    },
    options: {
      responsive: true,
      scales: {
        y: { position: 'left', ticks: { color: '#8B98A8' }, grid: { color: '#2A3644' } },
        y1: { position: 'right', ticks: { color: '#8B98A8' }, grid: { display: false } },
        x: { ticks: { color: '#8B98A8' }, grid: { color: '#2A3644' } },
      },
      plugins: { legend: { labels: { color: '#E9EDF1' } } }
    }
  });
}

// Lightweight companion to buildHoursSummaryHTML() -- computes just the
// Remaining Hours totals (no table HTML) for compact summaries like the
// home screen card.
async function getRemainingHoursTotals(report) {
  const invoices = await getInvoicesCached();
  if (!invoices.length) return null;

  const sortedInvoices = [...invoices].sort((a, b) => {
    const da = parseSlashDate(a.invoice.period_start);
    const db = parseSlashDate(b.invoice.period_start);
    return (da && db) ? da - db : 0;
  });
  const earliestInvoice = sortedInvoices[0];
  const yearSnapshots = ["Year 1", "Year 2", "Year 3", "Year 4", "Year 5"].map(label =>
    (earliestInvoice.contract_year_snapshots || []).find(y => y.period_label === label)
  );

  function billedHoursForInvoice(personName, invoiceNo) {
    const p = report.passengers.find(pp => pp.name === personName);
    if (!p) return 0;
    let sum = 0;
    for (const m of p.months) {
      for (const t of m.trips) {
        if (t.invoiceNo === invoiceNo) sum += (t.billedHours || 0);
      }
    }
    return round2(sum);
  }

  const invoiceRows = sortedInvoices.map(inv => ({
    jon: billedHoursForInvoice(HOURS_SUMMARY_PEOPLE[0], inv.invoice.invoice_id),
    rob: billedHoursForInvoice(HOURS_SUMMARY_PEOPLE[1], inv.invoice.invoice_id),
  }));

  const yearBuckets = yearSnapshots.map(y => ({
    snapshot: y,
    start: y ? parseSlashDate(y.period_start) : null,
  }));
  const today = new Date();
  const yearsWithSnapshot = yearBuckets.filter(b => b.snapshot && b.start && b.start <= today).length;

  const totalJonBilled = invoiceRows.reduce((sum, r) => sum + r.jon, 0);
  const totalRobBilled = invoiceRows.reduce((sum, r) => sum + r.rob, 0);
  const jon = round2(yearsWithSnapshot * HOURS_SUMMARY_STARTING_HOURS - totalJonBilled);
  const rob = round2(yearsWithSnapshot * HOURS_SUMMARY_STARTING_HOURS - totalRobBilled);
  return { jon, rob, total: round2(jon + rob) };
}

// Lightweight companion to renderPsBalanceTable() -- computes just the
// Remaining Balance totals for the home screen card.
async function getRemainingPsBalanceTotals() {
  const deductions = await Store.listPsBalanceDeductions();
  let jon = PS_BALANCE_OPENING;
  let rob = PS_BALANCE_OPENING;
  for (const item of deductions) {
    if (item.personKey === "jon") jon -= item.deductionAmount;
    else if (item.personKey === "rob") rob -= item.deductionAmount;
  }
  return { jon, rob, total: jon + rob };
}

// Lightweight companion to renderReservationsList() -- returns only
// future-dated reservations, sorted soonest-first, for compact summaries
// like the home screen card.
async function getUpcomingReservations() {
  const reservations = await Store.listReservations();
  const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const now = new Date();
  const withDates = reservations.map(r => {
    const inferredYear = inferReservationYear(r.date, r.emailInternalDate);
    let sortDate = null;
    if (r.date && inferredYear) {
      const [monthName, dayStr] = r.date.split(" ");
      const monthIndex = MONTH_NAMES.indexOf(monthName);
      if (monthIndex !== -1) sortDate = new Date(inferredYear, monthIndex, Number(dayStr) || 1);
    }
    return { ...r, inferredYear, sortDate };
  });
  const upcoming = withDates.filter(r => r.sortDate && r.sortDate >= now);
  upcoming.sort((a, b) => a.sortDate - b.sortDate);
  return upcoming;
}

// window.storage is an API Claude injects only when this artifact is
// rendered inside Claude's own interface -- it will NOT exist if this
// HTML file is downloaded and opened directly in a regular browser
// (file:// or otherwise outside Claude). Check up front and show a clear
// explanation instead of letting every Save/Delete/etc. fail with a
// cryptic "Cannot read properties of undefined" error.
const DRIVE_CLIENT_ID = '199114602407-31geakspltrct7pu85vm9kofu3c9rfaq.apps.googleusercontent.com';
// Widened from drive.file to full drive access: drive.file only lets an
// app see files IT created under the CURRENT signed-in account, which
// doesn't work for a shared multi-user setup -- a viewer signing in with
// a different Google account needs to find/read the SAME file the owner
// created and shared with them via Drive's own sharing feature. Combined
// with userinfo.email so the app can tell who's actually signed in (to
// distinguish the owner from view-only users).
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/gmail.readonly';
// The one account allowed to upload/edit/delete -- everyone else who
// signs in gets read-only access to the same shared data. Real
// enforcement also happens at the Google Drive permission level (share
// the file as "Viewer" with everyone else), so this UI-level check is a
// second layer, not the only one.
const OWNER_EMAIL = 'jskagan@gmail.com';
let currentUserEmail = null;
let isOwner = false;
let tokenClient = null;

function showSignInStatus(message, isError) {
  const el = document.getElementById('signin-status');
  if (el) {
    el.textContent = message;
    el.style.color = isError ? 'var(--red)' : 'var(--muted)';
  }
}

async function fetchSignedInUserEmail() {
  const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
    headers: { Authorization: `Bearer ${driveAccessToken}` },
  });
  if (!res.ok) throw new Error(`userinfo request failed: ${res.status}`);
  const data = await res.json();
  return data.email || null;
}

async function completeSignIn() {
  let stage = 'signing you in';
  try {
    showSignInStatus('Loading your data from Drive…', false);

    stage = 'signing you in';
    currentUserEmail = await fetchSignedInUserEmail();
    isOwner = !!(currentUserEmail && currentUserEmail.toLowerCase() === OWNER_EMAIL.toLowerCase());

    stage = 'finding your data file in Drive';
    driveFileId = await findDriveDataFile();

    stage = 'loading your data from Drive';
    if (driveFileId) {
      driveData = await loadDriveDataFile(driveFileId);
    } else if (isOwner) {
      stage = 'creating a new data file in Drive';
      driveData = { invoices: [], report: null, reservations: [], psBalanceDeductions: [] };
      driveFileId = await createDriveDataFile(driveData);
    } else {
      // A viewer signed in but the shared file hasn't been shared with
      // them yet (or doesn't exist) -- don't silently create a new,
      // separate file under their account, since that would defeat the
      // whole point of everyone seeing the same shared data.
      throw new Error('No shared flight log data found for this account yet. Ask the owner to share the data file with you in Google Drive.');
    }

    stage = 'setting up the menu';
    if (!isOwner) {
      document.getElementById('nav-upload-btn').style.display = 'none';
      document.getElementById('view-only-badge').style.display = '';
    } else {
      document.getElementById('utilities-toggle').style.display = '';
    }

    // Build the home dashboard (and its data-dependent summaries) while
    // still hidden behind the splash screen, so the splash stays up
    // through the load instead of revealing a screen full of "Loading…"
    // placeholders. #app-root is display:none at this point, but writing
    // into #main still works fine -- it just isn't visible yet.
    stage = 'building the home screen';
    await renderHome();

    stage = 'refreshing menu counts';
    try {
      await refreshNavCounts();
    } catch (e) {
      console.error('refreshNavCounts on startup failed:', e);
    }

    document.getElementById('splash-screen').style.display = 'none';
    document.getElementById('signin-gate').style.display = 'none';
    document.getElementById('app-root').style.display = '';
  } catch (e) {
    console.error(`completeSignIn failed while ${stage}:`, e);
    // Surface the error on the actual sign-in screen -- if this failed
    // on the cached-token fast path (splash still showing, signin-gate
    // never shown yet), leaving the splash up forever with no visible
    // error or way to retry would strand the user.
    document.getElementById('splash-screen').style.display = 'none';
    document.getElementById('signin-gate').style.display = 'flex';
    showSignInStatus(`Something went wrong while ${stage}: ` + (e.message || e), true);
  }
}

function initGoogleAuth() {
  // If a valid cached token exists (from a previous "remember me" sign-in
  // within the last ~hour), skip the sign-in screen entirely.
  const cached = loadCachedToken();
  if (cached) {
    driveAccessToken = cached;
    completeSignIn();
    return;
  }

  // No cached session -- the splash screen has done its job (covering
  // the brief Google Identity Services load wait), so reveal the actual
  // sign-in screen now.
  document.getElementById('splash-screen').style.display = 'none';
  document.getElementById('signin-gate').style.display = 'flex';

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (response) => {
      if (response.error) {
        showSignInStatus('Sign-in failed: ' + response.error, true);
        return;
      }
      driveAccessToken = response.access_token;
      const rememberMe = document.getElementById('remember-me-checkbox').checked;
      if (rememberMe) {
        saveCachedToken(response.access_token, response.expires_in);
      } else {
        clearCachedToken();
      }
      completeSignIn();
    },
  });
  document.getElementById('signin-btn').addEventListener('click', () => {
    showSignInStatus('Opening Google sign-in…', false);
    tokenClient.requestAccessToken();
  });
}

// Google Identity Services loads asynchronously (the <script> tag has
// `defer`); poll briefly for it to be ready rather than assuming it's
// already there by the time this script runs.
(function waitForGoogleIdentity(triesLeft = 50) {
  if (window.google && window.google.accounts && window.google.accounts.oauth2) {
    initGoogleAuth();
  } else if (triesLeft > 0) {
    setTimeout(() => waitForGoogleIdentity(triesLeft - 1), 100);
  } else {
    document.getElementById('splash-screen').style.display = 'none';
    document.getElementById('signin-gate').style.display = 'flex';
    showSignInStatus('Could not load Google Sign-In. Check your connection and reload the page.', true);
  }
})();

document.getElementById('signout-btn').addEventListener('click', () => {
  clearCachedToken();
  driveAccessToken = null;
  location.reload();
});

</script>
